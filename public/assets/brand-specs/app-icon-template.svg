<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- League app icon master, 1024 x 1024. SOLID background to every edge (no transparency).
       Phones mask it to a circle or rounded square, so keep the mark inside the circle.
       Delete the "GUIDES" group before you export. -->
  <g id="BACKGROUND"><rect width="1024" height="1024" fill="#1f2937"/></g>
  <g id="ARTWORK"></g>
  <g id="GUIDES">
    <circle cx="512" cy="512" r="410" stroke="#ff2d95" fill="none" stroke-width="4" stroke-dasharray="16 10"/>
    <rect x="2" y="2" width="1020" height="1020" rx="230" stroke="#ff2d95" fill="none" stroke-width="3" opacity="0.6"/>
    <text x="512" y="70" text-anchor="middle" font-size="28" fill="#ff2d95" font-family="Arial, Helvetica, sans-serif" font-weight="700">Fill the background to the edges</text>
    <text x="512" y="980" text-anchor="middle" font-size="28" fill="#ff2d95" font-family="Arial, Helvetica, sans-serif" font-weight="700">Keep the mark inside the circle (80%)</text>
    <text x="512" y="520" text-anchor="middle" font-size="30" fill="#ff2d95" font-family="Arial, Helvetica, sans-serif" font-weight="700" opacity="0.45">DELETE THIS GUIDES LAYER BEFORE EXPORT</text>
  </g>
</svg>
