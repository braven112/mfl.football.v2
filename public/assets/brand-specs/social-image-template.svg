<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- League social share image, 1200 x 630. SOLID background (no transparency).
       Some apps crop to the centre square, so keep the logo inside it.
       Delete the "GUIDES" group before you export. -->
  <g id="BACKGROUND"><rect width="1200" height="630" fill="#1f2937"/></g>
  <g id="ARTWORK"></g>
  <g id="GUIDES">
    <rect x="60" y="40" width="1080" height="550" stroke="#ff2d95" fill="none" stroke-width="4" stroke-dasharray="16 10"/>
    <rect x="285" y="0" width="630" height="630" stroke="#ff2d95" fill="none" stroke-width="4" stroke-dasharray="16 10" opacity="0.6"/>
    <text x="600" y="30" text-anchor="middle" font-size="22" fill="#ff2d95" font-family="Arial, Helvetica, sans-serif" font-weight="700">Keep text inside the outer dashed box</text>
    <text x="600" y="320" text-anchor="middle" font-size="24" fill="#ff2d95" font-family="Arial, Helvetica, sans-serif" font-weight="700">Logo goes in the centre square</text>
    <text x="600" y="620" text-anchor="middle" font-size="18" fill="#ff2d95" font-family="Arial, Helvetica, sans-serif" font-weight="700" opacity="0.7">DELETE THIS GUIDES LAYER BEFORE EXPORT</text>
  </g>
</svg>
