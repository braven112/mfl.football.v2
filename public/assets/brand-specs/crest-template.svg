<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Team crest master, 1024 x 1024, TRANSPARENT background.
       Draw your crest in the "ARTWORK" group. Delete the "GUIDES" group before you export. -->
  <g id="ARTWORK"></g>
  <g id="GUIDES">
    <rect x="2" y="2" width="1020" height="1020" stroke="#ff2d95" fill="none" stroke-width="4"/>
    <rect x="64" y="64" width="896" height="896" stroke="#ff2d95" fill="none" stroke-width="4" stroke-dasharray="16 10"/>
    <circle cx="512" cy="512" r="448" stroke="#ff2d95" fill="none" stroke-width="4" stroke-dasharray="16 10"/>
    <text x="512" y="46" text-anchor="middle" font-size="26" fill="#ff2d95" font-family="Arial, Helvetica, sans-serif" font-weight="700">SAFE AREA: keep the crest inside the dashed square</text>
    <text x="512" y="1000" text-anchor="middle" font-size="26" fill="#ff2d95" font-family="Arial, Helvetica, sans-serif" font-weight="700">Some screens crop to the circle. Keep faces and letters inside it.</text>
    <text x="512" y="520" text-anchor="middle" font-size="30" fill="#ff2d95" font-family="Arial, Helvetica, sans-serif" font-weight="700" opacity="0.45">DELETE THIS GUIDES LAYER BEFORE EXPORT</text>
  </g>
</svg>
