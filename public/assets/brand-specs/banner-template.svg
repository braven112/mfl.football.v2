<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="316" viewBox="0 0 1900 316">
  <!-- Team banner master, 1900 x 316 (6:1), TRANSPARENT background.
       Crest on the left, team name to its right. Delete the "GUIDES" group before you export. -->
  <g id="ARTWORK"></g>
  <g id="GUIDES">
    <rect x="2" y="2" width="1896" height="312" stroke="#ff2d95" fill="none" stroke-width="4"/>
    <rect x="24" y="16" width="1852" height="284" stroke="#ff2d95" fill="none" stroke-width="4" stroke-dasharray="16 10"/>
    <rect x="300" y="16" width="0" height="284" stroke="#ff2d95" fill="none" stroke-width="4" stroke-dasharray="16 10"/>
    <rect x="40" y="24" width="268" height="268" stroke="#ff2d95" fill="none" stroke-width="4" stroke-dasharray="16 10" opacity="0.5"/>
    <text x="174" y="166" text-anchor="middle" font-size="26" fill="#ff2d95" font-family="Arial, Helvetica, sans-serif" font-weight="700">CREST</text>
    <text x="1080" y="150" text-anchor="middle" font-size="44" fill="#ff2d95" font-family="Arial, Helvetica, sans-serif" font-weight="700">TEAM NAME</text>
    <text x="1080" y="200" text-anchor="middle" font-size="24" fill="#ff2d95" font-family="Arial, Helvetica, sans-serif" font-weight="700">Big, bold letters. A phone shows this about a fifth of this size.</text>
    <text x="1080" y="290" text-anchor="middle" font-size="22" fill="#ff2d95" font-family="Arial, Helvetica, sans-serif" font-weight="700" opacity="0.6">DELETE THIS GUIDES LAYER BEFORE EXPORT</text>
  </g>
</svg>
