name: 'Setup pnpm + Node + install'
description: >
  Shared CI preamble used by (almost) every workflow in this repo: installs
  pnpm, sets up Node with pnpm's dependency cache, then runs
  `pnpm install --frozen-lockfile`. actions/checkout cannot run inside a
  composite action, so callers must check out the repo themselves in the
  step immediately before this one.

  The pnpm VERSION is not set here. `pnpm/action-setup` reads it from the
  `packageManager` field in package.json, which is the single source for CI,
  Vercel and local corepack alike — a `version:` here would be a second copy
  that can silently disagree with the one the lockfile was generated with.
inputs:
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '22'
runs:
  using: 'composite'
  steps:
    # No `version:` — see the note above; package.json#packageManager is it.
    - name: Setup pnpm
      uses: pnpm/action-setup@v5

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
