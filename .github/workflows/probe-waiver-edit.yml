name: Probe waiver claim actions

# What can an owner DO to a filed waiver claim on MFL's own page? Its claims
# table offers "Edit | Copy To Round N | Delete" — this prints those controls
# and their targets, so a reorder feature is built against what MFL actually
# exposes rather than against a guess.
#
# Read-only: a GET. Writes nothing. (`import?TYPE=waiverRequest` with REPLACE=1
# was tested on 2026-09-02 and is INERT for this league — empty 200, timestamp
# unchanged — which is why the mechanism has to come from the page.)
#
# Dispatch only, no schedule. Delete once the answer is recorded.
on:
  workflow_dispatch:
    inputs:
      league:
        description: 'League slug (e.g. afl-fantasy)'
        required: true
        type: string

concurrency:
  group: probe-waiver-edit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      - name: Inspect the claim-row actions
        env:
          MFL_USER_ID: ${{ secrets.MFL_USER_ID }}
          INPUT_LEAGUE: ${{ inputs.league }}
        run: node ./scripts/probe-waiver-edit.mjs --league="$INPUT_LEAGUE"
