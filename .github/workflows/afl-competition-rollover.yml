name: AFL Competition Rollover

# Recomputes the AFL all-play tier (Premier League / D-League) champions for the
# latest completed season and rolls promotion/relegation forward into next
# season's makeup (data/afl-fantasy/competition-history.json), then refreshes the
# trophy-wall tier champions in data/afl-fantasy/awards-history.json.
#
# While a season is being played, each run also rewrites NEXT season's makeup
# as a projection through the last finished NFL week (`projected:<year>`), so
# articles can name who is on course to go up or down (Brandon, 2026-11-24).
# The final roll-forward replaces it once the week-17 (cutoff) all-play is
# final; in the offseason runs are no-ops and the commit guard skips them.
# Runs offline against the genuine 2024+ local feeds that Roster Sync keeps
# current, so no MFL credentials are needed.
#
# Schedule lives in code, per the repo rule (no GitHub Actions `vars.*` gates):
# to pause, comment out the cron line below; to change cadence, edit it here.

on:
  schedule:
    # Tuesdays 16:00 UTC (8 AM PT): an NFL week ends with Monday night, and the
    # site's week turns over Tuesday at midnight PT, so this run is the first to
    # count the week just played in the projection.
    - cron: "0 16 * * 2"
  workflow_dispatch:

concurrency:
  group: afl-competition-rollover
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rollover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      - name: Compute tier champions + roll makeup forward
        run: node ./scripts/compute-afl-competition-movement.mjs

      - name: Refresh trophy-wall tier champions
        run: node ./scripts/compute-afl-awards.mjs --offline

      - name: Commit and push updates
        uses: ./.github/actions/commit-push
        with:
          add-paths: 'data/afl-fantasy/competition-history.json data/afl-fantasy/awards-history.json'
          commit-message: 'chore(afl): roll tier makeup forward + refresh tier champions'
          no-changes-message: 'No tier rollover changes to commit.'
          git-user-name: 'AFL Tier Bot'
          pull-rebase: 'true'
