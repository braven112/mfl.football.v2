name: CI

on:
  # `staging` is a production-level branch, not a staging area — real owners use
  # staging.theleague.us, it writes production's database, and `main`
  # fast-forwards to it on release day. So a PR into `staging` gets exactly the
  # gate a PR into `main` gets. Omitting it here was the one change that would
  # have made the release train strictly worse than no train: every feature PR
  # would have merged with no unit tests at all.
  # See docs/plans/staging-release-process.md.
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: pnpm test:unit

  typecheck:
    name: Type baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      # Ratchets the `astro check` error total: fails if it rises (a regression)
      # and if it drops (retighten tests/fixtures/typecheck-baseline.json).
      # Runs as its own job so it never delays the unit-test signal.
      - name: Check type-error baseline
        run: pnpm test:types
        env:
          # rosters.astro needs the big heap — 8192 OOMs, verified on a
          # 15 GB / 4 vCPU box matching ubuntu-latest. Don't lower this.
          TYPECHECK_NODE_OPTIONS: --max-old-space-size=12288
