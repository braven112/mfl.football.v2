name: Schedule Release

# Locks each league's schedule reveal on its release day, then archives it.
#
# Runs DAILY year-round and self-guards: the API refuses to lock before the
# league's release date, and refuses before the NFL bye calendar for the season
# has actually landed. Every other day of the year this is a no-op that exits 0.
#
# Release days (derived, not fixed — see src/utils/schedule-release.mjs):
#   The League  June 1
#   AFL         the Sunday two weeks before its National League draft, which is
#               itself the Sunday eight days before Labor Day
#
# Unlike the other workflows here this one does not compute-and-commit: the lock
# is atomic and lives in Redis, which Actions cannot reach, so it POSTs to the
# deployed app and commits the archive the API hands back. Generating a second
# copy locally would produce a DIFFERENT valid schedule (the optimiser anneals),
# and the archive would disagree with what the league was shown.

on:
  schedule:
    # 9am PT (16:00 UTC), daily.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      league:
        description: "Single league slug (blank = every configured league)"
        required: false
        type: string
      year:
        description: "Season to reveal (blank = current calendar year)"
        required: false
        type: string
      dry_run:
        description: "Report what would happen without locking anything"
        required: false
        type: boolean
        default: false

concurrency:
  group: schedule-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Refresh the NFL bye calendar
        # The reveal cannot happen without it, and it is the one input that
        # arrives on the NFL's schedule rather than ours.
        run: node scripts/fetch-nfl-bye-weeks.mjs
        continue-on-error: true

      - name: Lock the reveal
        env:
          SCHEDULE_RELEASE_TOKEN: ${{ secrets.SCHEDULE_RELEASE_TOKEN }}
          SCHEDULE_RELEASE_ORIGIN: ${{ vars.SCHEDULE_RELEASE_ORIGIN }}
        run: |
          node scripts/lock-schedule-release.mjs \
            ${{ inputs.league && format('--league={0}', inputs.league) || '' }} \
            ${{ inputs.year && format('--year={0}', inputs.year) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit the bye calendar and any archived reveal
        run: |
          git config user.name "Schedule Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nfl/bye-weeks.json 'data/*/schedule-release' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: schedule release — lock and archive"
          # Another cron may have pushed while this ran; rebase rather than fail.
          git pull --rebase origin main
          git push origin HEAD:main
