name: Roger Improvement Loop

# Weekly rubric audit of real Ask Roger traffic (see CLAUDE.md → "Ask Roger
# eval"). scripts/roger-improvement-loop.ts pulls owner questions from Redis,
# grades each answer (deterministic format graders + Claude Opus rubric
# judge), and commits:
#   - data/roger-improvement/audit-ledger.json    (what's been graded)
#   - data/roger-improvement/proposed-cases.json  (failures drafted as eval
#     cases, awaiting HUMAN review — never auto-promoted)
#   - data/roger-improvement/latest-report.md     (failures + prompt
#     improvement suggestions)
#
# Closing the loop is deliberately manual: review a proposal, set
# "reviewed": true, run `pnpm improve:roger --promote <id,...>`, apply any
# prompt suggestion, then `pnpm eval:roger` to verify fix + no regression.
#
# Because that gate is human, the run ends by NOTIFYING one (see the last
# step) — committing a report to the repo is not delivery.

on:
  schedule:
    # 16:23 UTC Monday = ~8:23am Pacific. Avoid the top-of-hour cron stampede.
    - cron: "23 16 * * 1"
  workflow_dispatch:

concurrency:
  group: roger-improvement-loop
  cancel-in-progress: true

permissions:
  contents: write
  # scripts/roger-improvement-notify.mjs files one issue per unreviewed proposal.
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      - name: Audit new Ask Roger traffic
        run: pnpm improve:roger --limit 25
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}

      - name: Commit and push updates
        uses: ./.github/actions/commit-push
        with:
          add-paths: 'data/roger-improvement'
          commit-message: 'chore: roger improvement loop audit'
          no-changes-message: 'No new Ask Roger traffic to audit.'
          git-user-name: 'Roger Improvement Bot'

      # The loop caught the August 2026 taxi-squad ruling correctly and then
      # told nobody — the finding sat unreviewed for 17 days until the
      # commissioner noticed the wrong answer in the group chat. This step is
      # the delivery half: a GitHub issue per unreviewed proposal (the durable
      # record) plus one commissioner DM (the alarm). Silent when nothing is
      # pending. `always()` so a failed audit still surfaces the backlog.
      #
      # GROUPME_COMMISSIONER_USER_ID is the DM recipient — find it with
      # `node scripts/roger-improvement-notify.mjs --list-members`. Without it
      # the issue is still filed and the step logs a ::warning:: instead.
      - name: Notify on unreviewed findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROUPME_SERVICE_TOKEN: ${{ secrets.GROUPME_SERVICE_TOKEN }}
          GROUPME_COMMISSIONER_USER_ID: ${{ secrets.GROUPME_COMMISSIONER_USER_ID }}
          TZ: America/Los_Angeles
        run: node scripts/roger-improvement-notify.mjs
