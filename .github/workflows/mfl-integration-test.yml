name: MFL Integration Test

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/utils/mfl-contract-writer.ts'
      - 'src/utils/contract-*.ts'
      - 'src/pages/api/contracts/**'
      - 'tests/mfl-write-integration.test.ts'
  schedule:
    # Daily canary — 7am PT (14:00 UTC) catches credential expiry or MFL API changes
    - cron: '0 14 * * *'
  workflow_dispatch:

concurrency:
  group: mfl-integration-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    runs-on: ubuntu-latest
    outputs:
      # Read by the rollback job. A dead cookie is an environment failure, not
      # a regression in the pushed commit — the write tests fail with "requires
      # commissioner access" no matter what the commit changed.
      cookie_ok: ${{ steps.cookie.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Need history for rollback job
          fetch-depth: 2

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      # Log in with the username/password secrets (which do not expire) and
      # export a fresh MFL_USER_ID / MFL_IS_COMMISH to every later step. The
      # stored cookie secrets are only the fallback when login fails. Later
      # steps must not re-declare the stored cookie secret in their own env:
      # a step-level env overrides $GITHUB_ENV and would reinstate the stale
      # one. tests/mfl-integration-rollback-guard.test.ts pins that.
      - name: Mint a fresh MFL session
        env:
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          MFL_USER_ID: ${{ secrets.MFL_USER_ID }}
          MFL_IS_COMMISH: ${{ secrets.MFL_IS_COMMISH }}
        run: node scripts/mint-mfl-session.mjs

      - name: Run MFL integration tests
        env:
          # Hardcoded to test league — safe to write/revert without affecting production
          MFL_LEAGUE_ID: '36189'
        run: pnpm test:mfl-integration

      - name: Owner cookie replay check (read-only)
        # Continuous verification for the August cuts automation: the deadline
        # job replays stored owner cookies from an Actions runner, so this
        # canary replays the stored cookie against the cheap authenticated
        # myleagues read on every pipeline run. Strictly read-only. Runs even
        # when the write tests above failed (independent signal for "the
        # cookie itself died"), and skips itself when the secret is absent.
        id: cookie
        if: always()
        run: node scripts/check-owner-cookie-replay.mjs

  rollback:
    needs: integration-test
    runs-on: ubuntu-latest
    # Only rollback on push to main (not PRs, cron, or manual runs), and only
    # when the failure can be the commit's fault:
    #
    #   - cookie_ok: when the stored MFL cookie is dead EVERY commit fails, so
    #     a revert cannot fix anything — it just removes unrelated work.
    #   - not our own commit: reverting a bot revert re-lands the original,
    #     which fails the same way and gets reverted again. On 2026-09-05 an
    #     expired cookie put that loop on main for over an hour — a production
    #     deploy and a new issue every 75 seconds, with the notifications API
    #     appearing and vanishing between them.
    #
    # tests/mfl-integration-rollback-guard.test.ts pins both conditions.
    if: >-
      failure()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.integration-test.outputs.cookie_ok == 'true'
      && github.event.head_commit.author.name != 'MFL Integration Bot'
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Get failed commit info
        id: commit-info
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          COMMIT_MSG=$(git log -1 --format='%s' "$GH_SHA")
          COMMIT_AUTHOR=$(git log -1 --format='%an' "$GH_SHA")
          echo "message=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          echo "author=$COMMIT_AUTHOR" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GH_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Revert the commit
        env:
          GH_SHA: ${{ github.sha }}
        run: |
          git config user.name "MFL Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git revert --no-edit "$GH_SHA"
          git push origin main

      - name: Create GitHub Issue
        uses: actions/github-script@v7
        env:
          COMMIT_MSG: ${{ steps.commit-info.outputs.message }}
          COMMIT_AUTHOR: ${{ steps.commit-info.outputs.author }}
          SHORT_SHA: ${{ steps.commit-info.outputs.short_sha }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `MFL Integration Test Failed — auto-reverted ${process.env.SHORT_SHA}`,
              body: [
                `## MFL Contract Write Test Failed`,
                ``,
                `The integration test against test league 36189 failed after a push to main.`,
                `The commit has been **automatically reverted**.`,
                ``,
                `| Field | Value |`,
                `|-------|-------|`,
                `| Commit | \`${context.sha}\` |`,
                `| Message | ${process.env.COMMIT_MSG} |`,
                `| Author | ${process.env.COMMIT_AUTHOR} |`,
                `| Workflow Run | [View logs](${runUrl}) |`,
                ``,
                `### Next Steps`,
                `1. Check the [workflow logs](${runUrl}) for the specific failure`,
                `2. Fix the issue on a branch`,
                `3. Open a PR — the integration test will run on the PR before merge`,
              ].join('\n'),
              labels: ['bug', 'mfl-integration'],
            });
