name: Probe MFL Commissioner Cookie

# READ-ONLY. Answers one question with evidence instead of theory: which MFL
# request, if any, issues the MFL_IS_COMMISH cookie?
#
# Two candidates are already ruled out by CI's own logs. api/<year>/login
# issues MFL_USER_ID and nothing else (#878), and <mflHost>/<year>/login with
# XML=1 logged in successfully against www49 and still reported "issued no
# MFL_IS_COMMISH" (mint-mfl-session, 2026-09-05) — which disproved the theory
# #878 was built on. This probe walks what is left: the same league login
# WITHOUT XML=1 (the interactive flow the docs describe), a commissioner-only
# csetup page fetched with a live session, and the league home as a control.
#
# It only ever issues GETs and one login POST, refuses any non-myfantasyleague
# host on a redirect, and prints cookie NAMES only — never a value.

on:
  workflow_dispatch:
    inputs:
      league:
        description: "League slug from the registry"
        required: false
        type: choice
        options: [afl-fantasy, theleague]
        default: afl-fantasy
      year:
        description: "League year (default: current calendar year)"
        required: false
        type: string
      write_test:
        description: "Also run the no-op write test against the TEST league (36189)"
        required: false
        type: boolean
        default: false
      withhold_stored_cookies:
        description: "PROOF RUN: run the write test with username/password ONLY (no stored cookie in the environment)"
        required: false
        type: boolean
        default: false

concurrency:
  group: probe-commish-cookie
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      - name: Resolve the league id from the registry
        id: league
        run: |
          ID=$(node -e "import('./src/config/leagues-data.mjs').then(m => process.stdout.write(m.LEAGUES['${{ inputs.league }}'].id))")
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Probe
        env:
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          MFL_LEAGUE_ID: ${{ steps.league.outputs.id }}
          MFL_YEAR: ${{ inputs.year }}
        run: node scripts/probe-commish-cookie.mjs

      # Writes to the TEST league only, and writes each value back UNCHANGED —
      # a genuine authenticated write whose success is a no-op by construction,
      # so MFL's answer is real and there is nothing to revert. It settles
      # whether MFL_IS_COMMISH is required at all, or whether the host was the
      # only variable that ever mattered.
      #
      # TWO STEPS, NOT ONE STEP WITH A CONDITIONAL env. A GitHub expression
      # like `inputs.x && '' || secrets.Y` does NOT withhold the secret: the
      # empty string is falsy, so the `||` falls through and the secret is
      # passed anyway — the run would look like a proof and prove nothing.
      # Splitting it also puts the answer in the STEP NAME, so the run's own
      # log records which credentials were in scope rather than asking a
      # reader to reconstruct it from the inputs.
      - name: No-op write test (test league) — with the stored commissioner cookie
        if: inputs.write_test && !inputs.withhold_stored_cookies
        env:
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          MFL_IS_COMMISH: ${{ secrets.MFL_IS_COMMISH }}
          MFL_YEAR: ${{ inputs.year }}
        run: node scripts/probe-write-auth.mjs

      # THE PROOF RUN. Neither stored cookie is in scope: no MFL_IS_COMMISH,
      # and probe-write-auth.mjs never reads MFL_USER_ID at all — it logs in
      # and uses the cookie MFL hands back. So the only credential that can
      # explain an ACCEPTED write here is MFL_USERNAME + MFL_PASSWORD. If this
      # step passes, the stored cookie secrets are not load-bearing for a
      # commissioner contract write, and the jobs that replay them can stop.
      - name: No-op write test (test league) — username/password ONLY
        if: inputs.write_test && inputs.withhold_stored_cookies
        env:
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          MFL_YEAR: ${{ inputs.year }}
        run: node scripts/probe-write-auth.mjs
