name: MFL Live mobile (Android)

# Checks and builds the MFL Football phone app (apps/mobile).
#
# The build runs HERE, on the GitHub runner (`eas build --local`), not on
# Expo's servers. Expo's free plan allows a fixed number of cloud Android
# builds a month and this repo used them all up in a day (2026-10-27): every
# app push to staging started one, and most were overtaken by the next push
# before anyone installed them. A local build is not counted against that
# quota. It still signs with the keystore EAS holds (fetched with EXPO_TOKEN),
# so an APK built here installs over one built on expo.dev.
#
#   pull request  -> type-check only
#   push          -> (staging only) type-check only; a build is a deliberate act
#   Run workflow  -> type-check, then build `preview` (installable APK) or
#                    `production` (signed AAB for Play), here or (runner:
#                    expo) on EAS as before
#
# A preview APK built from staging is published to the rolling `mobile-preview` prerelease, so
# the newest test build always downloads from one fixed link:
#   https://github.com/<repo>/releases/download/mobile-preview/mfl-football.apk
# A production AAB is attached to the run as an artifact.
#
# Needs the EXPO_TOKEN repository secret (expo.dev -> Account settings ->
# Access tokens). Without it the build step says so and is skipped; the
# type-check still runs. Signing keys are generated and held by EAS, never in
# the repo.

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/shared-types/**'
      - '.github/workflows/mobile-android.yml'
  push:
    # Staging only: a release fast-forwards main to a commit staging already
    # built, so a main trigger would spend a second build on the same APK.
    branches: [staging]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared-types/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile: preview (installable APK) or production (signed AAB for Play)'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      runner:
        description: 'Where to build: github (this runner, free) or expo (EAS cloud, uses the monthly free quota)'
        required: true
        default: github
        type: choice
        options:
          - github
          - expo

concurrency:
  group: mobile-android-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The shared preamble: pnpm at the pinned version, Node, and the root
      # install. The app is its own pnpm workspace, so it installs next.
      - name: Setup pnpm + Node
        uses: ./.github/actions/setup

      - name: Install the app's dependencies
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: apps/mobile
        run: pnpm run typecheck

  build:
    name: Build
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write # the mobile-preview release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "HAS_EXPO_TOKEN=true" >> "$GITHUB_ENV"
          else
            echo "::notice::No EXPO_TOKEN secret yet; skipping the build. Add it under Settings -> Secrets and variables -> Actions."
          fi

      - name: Setup pnpm + Node
        if: env.HAS_EXPO_TOKEN == 'true'
        uses: ./.github/actions/setup

      # React Native's Gradle build wants JDK 17; the runner's Android SDK is
      # already installed and found through ANDROID_HOME.
      - name: Set up Java 17
        if: env.HAS_EXPO_TOKEN == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the app's dependencies
        if: env.HAS_EXPO_TOKEN == 'true'
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile

      - name: Set up EAS
        if: env.HAS_EXPO_TOKEN == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start the build on EAS
        if: env.HAS_EXPO_TOKEN == 'true' && inputs.runner == 'expo'
        working-directory: apps/mobile
        env:
          PROFILE: ${{ inputs.profile }}
        run: eas build --platform android --profile "$PROFILE" --non-interactive --no-wait

      - name: Build
        if: env.HAS_EXPO_TOKEN == 'true' && inputs.runner == 'github'
        working-directory: apps/mobile
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          if [ "$PROFILE" = production ]; then OUT=mfl-football.aab; else OUT=mfl-football.apk; fi
          eas build --local --platform android --profile "$PROFILE" --non-interactive --output "$GITHUB_WORKSPACE/$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Publish the test APK
        if: env.HAS_EXPO_TOKEN == 'true' && inputs.runner == 'github' && inputs.profile == 'preview' && github.ref == 'refs/heads/staging'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Test build of ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}, built $(date -u '+%Y-%m-%d %H:%M UTC'). Uninstall an older copy first if Android refuses to install it."
          if gh release view mobile-preview >/dev/null 2>&1; then
            gh release edit mobile-preview --notes "$NOTES"
            gh release upload mobile-preview "$OUT" --clobber
          else
            gh release create mobile-preview "$OUT" --prerelease --target "$GITHUB_SHA" \
              --title "MFL Football test build" --notes "$NOTES"
          fi
          echo "::notice::APK: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/mobile-preview/${OUT}"

      - name: Keep the build on the run
        if: env.HAS_EXPO_TOKEN == 'true' && inputs.runner == 'github'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          retention-days: 14
