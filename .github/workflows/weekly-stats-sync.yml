name: Weekly Stats Sync

on:
  schedule:
    # Run every Tuesday at 6 AM PT (1 PM UTC) - after Monday Night Football
    - cron: "0 13 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-weekly-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      - name: Fetch fantasy points allowed
        # Once per FULL-MANAGEMENT league. The numbers are scored with the
        # league's OWN scoring rules and land in data/<slug>/mfl-feeds/<year>/,
        # so the two files are genuinely different data and neither can stand in
        # for the other — the AFL simply had no file, which is why the player
        # modal's "Opp Avg" / "Opp Rank" columns were empty there.
        #
        # `--league=<slug>` rather than MFL_LEAGUE_ID: the script resolves the
        # id through src/config/leagues-data.mjs, so no MFL league id is spelled
        # out in this YAML (CLAUDE.md § League registry).
        run: |
          for SLUG in theleague afl; do
            echo "::group::Fantasy points allowed ($SLUG)"
            node ./scripts/fetch-fantasy-points-allowed.mjs --league="$SLUG"
            echo "::endgroup::"
          done

      - name: Commit and push updates
        uses: ./.github/actions/commit-push
        with:
          add-paths: 'data/'
          commit-message: 'chore: update weekly fantasy points allowed stats'
          no-changes-message: 'No stats changes to commit.'
          git-user-name: 'Stats Sync Bot'
