name: Schefter Lineup Reminders

# Pre-kickoff lineup check: flags teams starting OUT / IR / suspended / bye
# players or with empty starting slots, push-first with a GroupMe fallback.
# Clean lineups = no post. Logic: scripts/schefter-lineup-check.mjs.
#
# NO `schedule:` — the only trigger is the Vercel cron bridge
# (src/pages/api/cron/lineup-check.ts), which dispatches ahead of every real
# kickoff slot in the NFL schedule (lineupCheckDecision, sync-cadence.ts). The
# old Sundays-9:15am-PT schedule was delivered by GitHub at 11:44, 12:44 and
# 12:34 PT on three straight Sundays — after the 10am kickoffs — and a fixed
# Sunday time could never cover a London game or a Thursday opener anyway.
# See docs/claude/rules/lineups.md § "The pre-kickoff lineup warning".
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print would-be posts without Redis/GroupMe"
        required: false
        default: "false"

# Queue, never cancel: this job pushes to devices and GroupMe and commits
# feed posts — a cancel cannot un-send (storage-and-build.md).
concurrency:
  group: lineup-reminders
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # ssh-key + full history so commit-feed-and-push can rebase onto the
      # latest origin and push, same as the other feed-writing workflows.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      # One invocation covers every lineup-playing league in the registry
      # (best-ball leagues are skipped by the bestBall flag). A per-week Redis
      # set of already-alerted problems makes the back-to-back dispatches and
      # accidental re-runs quiet.
      - name: Run Schefter lineup check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROUPME_SCHEFTER_BOT_ID: ${{ secrets.GROUPME_SCHEFTER_BOT_ID }}
          GROUPME_AFL_SCHEFTER_BOT_ID: ${{ secrets.GROUPME_AFL_SCHEFTER_BOT_ID }}
          # Web push is the PRIMARY channel for this alert now — the chat post
          # only carries the owners push could not reach. Without this secret
          # the fan-out sends nothing, every flagged owner counts as unreached,
          # and the chat gets the full broadcast: safe, but the migration never
          # actually starts. It was missing from this workflow entirely until
          # Sep 2026, so the push half had never once run.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Resolves the group's member list so unreached owners can be
          # @-mentioned rather than only named. Absent = plain-text names, which
          # is a weaker callout but still a correct post.
          GROUPME_SERVICE_TOKEN: ${{ secrets.GROUPME_SERVICE_TOKEN }}
          GROUPME_GROUP_ID: ${{ secrets.GROUPME_GROUP_ID }}
          GROUPME_AFL_GROUP_ID: ${{ secrets.GROUPME_AFL_GROUP_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            node scripts/schefter-lineup-check.mjs --dry-run
          else
            node scripts/schefter-lineup-check.mjs
          fi

      # The check now also leaves each flagged owner an `assistant` post on
      # their own For You feed, so this job mutates the feed files and has to
      # commit them. commit-feed-and-push reconciles by post id on top of the
      # latest origin — the feeds are written by several workflows on
      # overlapping crons and a plain rebase collides on them. The "nothing
      # changed" guard lives inside the script, so a clean-lineups Sunday
      # commits nothing.
      - name: Commit and push feed updates
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "Schefter Bot"
          git config user.email "actions@users.noreply.github.com"
          node scripts/commit-feed-and-push.mjs \
            --branch main \
            --message "chore: schefter lineup check — assistant posts" \
            --files "src/data/theleague/schefter-feed.json,data/afl-fantasy/schefter-feed.json"
