name: Roger Correction

# Delivers a hand-authored "Ask Roger got that wrong" post to the league
# GroupMe. The copy lives in scripts/roger-correction.mjs (CORRECTIONS map);
# this workflow exists only because GROUPME_ROGER_BOT_ID is a repo secret and
# is therefore not available in every local or sandboxed checkout.
#
# TRIGGER — deliberately NOT "on: push to a branch". The push trigger is gated
# on the sentinel file `.github/roger-correction-send`, whose contents are the
# correction slug to send. To send a correction: write the slug into the
# sentinel and push it. To retire it: delete the sentinel in a later commit —
# that deletion DOES fire the workflow (a delete is a change to the filtered
# path), but the run resolves an empty slug and the `if` guard skips the send.
#
# THE PATH FILTER IS NOT AN IDEMPOTENCY GUARD. It stops UNRELATED pushes from
# re-firing the job, and nothing more. `push` evaluates `paths` against the
# commits in the push, so any history rewrite that re-delivers the sentinel
# commit — precisely what this repo's mandated `git rebase origin/main` +
# `--force-with-lease` does — fires the job again with the sentinel still at
# HEAD. GroupMe has no unsend, so the real guard is stateful and lives in the
# script: a `SET NX` claim on `roger:correction:sent:<slug>` plus a `sentAt`
# stamp on the entry. Do not weaken either one on the strength of this filter.
#
# workflow_dispatch is offered too, for manual sends once this file is on the
# default branch.

on:
  push:
    paths:
      - '.github/roger-correction-send'
  workflow_dispatch:
    inputs:
      correction:
        description: 'Correction slug (see CORRECTIONS in scripts/roger-correction.mjs)'
        required: true
        type: string
      force:
        # The escape hatch for a stuck claim. A correction whose send ended
        # ambiguously (5xx, unreadable status, network throw) keeps its claim on
        # purpose, and this job is the only caller holding the GroupMe secret —
        # without this input that correction could never be re-sent. Dispatch
        # only, never the sentinel path, and CHECK GROUPME FIRST: this exists to
        # recover a message that did not land, not to repeat one that did.
        description: 'Re-send even if already claimed/sent — verify in GroupMe first'
        required: false
        default: false
        type: boolean

concurrency:
  group: roger-correction
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Inputs reach the shell through env, never `${{ }}` splicing into the
      # script body — a dispatch input is attacker-controlled text and this job
      # holds live secrets. Splicing also breaks on a plain double quote.
      - name: Resolve correction slug
        id: slug
        env:
          CORRECTION_INPUT: ${{ inputs.correction }}
        run: |
          if [ -n "$CORRECTION_INPUT" ]; then
            slug="$CORRECTION_INPUT"
          elif [ -f .github/roger-correction-send ]; then
            slug="$(tr -d '[:space:]' < .github/roger-correction-send)"
          else
            echo "No sentinel file and no dispatch input — nothing to send."
            echo "slug=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$slug" in
            *[!a-z0-9-]*)
              echo "Refusing slug with unexpected characters: $slug" >&2
              exit 1
              ;;
          esac
          echo "Resolved correction slug: $slug"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Send correction to GroupMe
        if: steps.slug.outputs.slug != ''
        env:
          TZ: America/Los_Angeles
          SLUG: ${{ steps.slug.outputs.slug }}
          # Only a manual dispatch can set this; the sentinel path never does.
          FORCE: ${{ inputs.force }}
          GROUPME_ROGER_BOT_ID: ${{ secrets.GROUPME_ROGER_BOT_ID }}
          # The script claims roger:correction:sent:<slug> before posting, so a
          # re-fired run cannot double-post to the league.
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "::warning::--force requested: this will re-post even if already sent."
            node scripts/roger-correction.mjs --correction "$SLUG" --send --force
          else
            node scripts/roger-correction.mjs --correction "$SLUG" --send
          fi
