name: Migrate InMotion assets (one-off)

# One-off: copies the files mfl.football still serves from InMotion onto
# Vercel at the same paths (images to Blob, CSS/JS to public/), so the
# mfl.football root can leave InMotion. Runs here because the Claude sandbox
# cannot reach mfl.football. Delete this workflow once the PR it rides on
# merges. See scripts/inmotion-migration/migrate.mjs.

on:
  push:
    branches: [claude/project-thread-jjha9s]
    paths:
      - scripts/inmotion-migration/urls.txt
      - scripts/inmotion-migration/migrate.mjs
      - .github/workflows/migrate-inmotion-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      - name: Copy files from InMotion
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node ./scripts/inmotion-migration/migrate.mjs

      - name: Commit and push copied files
        uses: ./.github/actions/commit-push
        with:
          check-paths: 'public scripts/inmotion-migration/report.json'
          add-paths: 'public scripts/inmotion-migration/report.json'
          commit-message: 'chore: copy InMotion assets to Vercel'
          no-changes-message: 'No InMotion assets changed.'
          push-ref: ${{ github.ref_name }}
