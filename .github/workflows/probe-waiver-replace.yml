name: Probe waiverRequest REPLACE

# Settles whether `import?TYPE=waiverRequest` + REPLACE=1 actually writes — the
# documented primitive for reordering a waiver round. That endpoint answered an
# authenticated, correctly-formed request with an empty 200 and stored nothing
# on 2026-09-02, so the docs alone are not evidence.
#
# THIS ONE WRITES. It replays the owner's EXISTING picks unchanged, so a working
# endpoint leaves them exactly where they started, and it refiles the claim via
# the known-good add_drop path if REPLACE clears the round. It refuses to run
# when no claim is pending. See the script header for the full safety design.
#
# Dispatch only, no schedule. Delete once the answer is recorded.
on:
  workflow_dispatch:
    inputs:
      league:
        description: 'League slug (e.g. afl-fantasy)'
        required: true
        type: string

concurrency:
  group: probe-waiver-replace
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      - name: Replay the round with REPLACE=1
        env:
          MFL_USER_ID: ${{ secrets.MFL_USER_ID }}
          INPUT_LEAGUE: ${{ inputs.league }}
        run: node ./scripts/probe-waiver-replace.mjs --league="$INPUT_LEAGUE"
