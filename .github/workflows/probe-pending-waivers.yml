name: Probe pendingWaivers shape

# Settles whether MFL's owner-gated `export?TYPE=pendingWaivers` actually shows
# a filed claim — the export the waiver-claim route treats as proof that a write
# landed. Its parser has only ever been tested against hand-written payloads,
# because the export needs a session cookie that lives only in secrets.
#
# The two failure modes are indistinguishable from outside: either the write is
# not landing, or it IS landing and the verification cannot see it. The second
# reports a filed claim as a failure, which is what an owner is being shown.
#
# Read-only: a GET. Writes nothing to MFL, commits nothing here. Delete once the
# waiver claim path is confirmed working.
on:
  workflow_dispatch:
    inputs:
      league:
        description: 'League slug (e.g. afl-fantasy)'
        required: false
        type: string
        default: ''

concurrency:
  group: probe-pending-waivers
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      - name: Probe pendingWaivers
        env:
          MFL_USER_ID: ${{ secrets.MFL_USER_ID }}
          INPUT_LEAGUE: ${{ inputs.league }}
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "$INPUT_LEAGUE" ]; then ARGS="--league=$INPUT_LEAGUE"; fi
          node ./scripts/probe-pending-waivers.mjs $ARGS
