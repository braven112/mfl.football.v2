name: AFL Waiver Order Check

# Once-a-year set AND drift check: is the AFL's live waiver order still the
# constitutional one? MFL does not carry waiverSortOrder across the June
# league-year rollover and no API import can set it back (2026-08-31 — see
# docs/claude/insights/domains/mfl-api.md), so it silently reverts to
# reverse-franchise-id. In 2026 that went unnoticed until ten days before Week 1.
#
# The order is set ONCE per league year, at the start (the owner's rule,
# Oct 2026). Every write must pass TWO checks, with no override: it is the
# beginning of the year (June 1 rollover → Week 1 kickoff), AND the live order
# is still MFL's rollover default (reverse franchise id). The writer enforces
# both itself, so a manual run obeys them too. It runs scripts/set-afl-waiver-order.ts
# --live, which writes through MFL's own WAIVORD form and verifies by
# re-reading. After that the order is no longer the default, so it is never
# written again that year; any later mismatch is only reported. Admins get a
# push either way, and a write that did not verify turns the run red.
#
# Self-guarding:
#   - Once any waiver transaction exists for the year, the AFL's ROLLING order
#     is supposed to have moved; the check reports that and exits 0.
#   - Before the previous season's NIT resolves there is no final base order to
#     compare against; it exits 0.
# Only the rollover default inside the pre-season window is written, and the
# writer itself refuses once a waiver claim has processed.
#
# Runs in June only — the order is set once a year, right after the June 1
# rollover — on four days, 8am PT (15:00 UTC). The first run that finds MFL on
# its default writes the order; the rest find it set and write nothing. The
# repeats are there because GitHub drops scheduled runs (see CLAUDE.md,
# "GitHub's `schedule` is not a cadence"), and one dropped run must not mean
# a season on the wrong order. Run it by hand any time from the Actions tab.

on:
  schedule:
    - cron: "0 15 2,9,16,23 6 *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Never write to MFL or send the alert, just print"
        type: boolean
        required: false
        default: false

concurrency:
  group: afl-waiver-order-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      # The MFL pair must be a commissioner of the AFL for the automatic write.
      # These are the same secrets the contract writers use (TheLeague's
      # commissioner); if the write fails on access, check that pair first —
      # the writer says so when MFL renders the page as Guest.
      - name: Check (and fix) waiver order
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MFL_USER_ID: ${{ secrets.MFL_USER_ID }}
          MFL_IS_COMMISH: ${{ secrets.MFL_IS_COMMISH }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          pnpm exec tsx scripts/check-afl-waiver-order.ts $ARGS
