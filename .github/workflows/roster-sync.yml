name: Roster Sync

on:
  # NO `schedule:`, deliberately. The only scheduled trigger is the Vercel cron
  # in vercel.json, which fires api/cron/roster-sync every five minutes and lets
  # src/utils/sync-cadence.ts decide which ticks become dispatches.
  #
  # GitHub does not honour a high-frequency schedule on this repo and it is not
  # a delay you can wait out. Measured over 300 runs: from 2026-08-27 the
  # delivered cadence collapsed from a 21-47 min median to a 2-5 HOUR median,
  # 5-8 runs a day against the 288 a five-minute cron asks for. Nothing here
  # changed that day and nothing was cancelled — GitHub simply stopped
  # dispatching, as it is allowed to. Every other scheduled job in this repo
  # degraded identically on the same day.
  #
  # A fallback schedule was tried and REMOVED after one night. It cannot be
  # offset out of the way, because GitHub delivers whenever it likes: the
  # `7,37` offset chosen to interleave with the primary was delivered at :16
  # and collided anyway. On 2026-09-17T15:16Z it cancelled a dispatch that had
  # already pushed, then failed its own rebase against six single-line feed
  # JSONs that git cannot merge — one sync lost, for a trigger contributing two
  # unpredictable runs a day and zero freshness the primary did not already
  # provide.
  #
  # Absence is watched instead of papered over: job-failure-watch.yml runs
  # scripts/check-sync-freshness.mjs, which alerts when main's newest sync
  # commit ages past two hours. That lives on GitHub ON PURPOSE — a watchdog
  # sharing a substrate with its subject goes dark in the one outage it exists
  # to report.
  workflow_dispatch:

concurrency:
  group: roster-sync
  # QUEUE, never cancel. `cancel-in-progress: true` killed a run on
  # 2026-09-17 *after* its push had already landed, leaving the surviving run
  # to rebase onto a main that had moved under it and fail on unmergeable
  # feed JSONs. A cancel cannot undo a push, and these steps push. Runs take
  # ~2 minutes against a 5-minute floor, so queueing settles long before the
  # next tick.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          # Shallow on purpose: this job runs ~35×/day and only needs the tip
          # to commit on top of. commit-push's `git pull --rebase origin main`
          # still works from a depth-1 clone (the pre-push fetch deepens as
          # needed). A full clone here re-downloads the entire multi-GB pack
          # on every run.
          fetch-depth: 1

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      # Single job, sequential loop over leagues rather than a
      # strategy.matrix: a matrix would spin up a separate job (and separate
      # checkout/install) per league, and this workflow ends with ONE shared
      # commit+push covering every league's output. Two matrix jobs racing to
      # commit/push at the end of a high-frequency cron is exactly the kind of
      # non-fast-forward push failure this refactor should avoid introducing
      # — so the fetch stays one job with a loop. Adding a league is still a
      # one-entry change: add a "slug:id:hasSalarySync" tuple to LEAGUES
      # below. hasSalarySync mirrors leagueHasFeature(slug, 'salaryCap') from
      # the league registry (src/config/leagues-data.mjs) — AFL doesn't have
      # contracts/salary cap, so its entry is "false" here exactly as the
      # pre-refactor workflow only ran "Update salary averages" for theleague.
      - name: Fetch MFL data for all leagues
        env:
          MFL_HOST: ${{ vars.MFL_HOST }}
          MFL_USERNAME: ${{ secrets.MFL_USERNAME }}
          MFL_PASSWORD: ${{ secrets.MFL_PASSWORD }}
          MFL_API_KEY: ${{ secrets.MFL_API_KEY }}
          # The calendar export is owner-gated and REJECTS an APIKEY ("Please be
          # sure to pass the proper MFL_USER_ID cookie"), which is why
          # calendar.json had never synced and the site's waiver window read
          # "unknown" permanently. fetch-mfl-feeds.mjs sends this cookie ONLY on
          # feeds marked `cookie: true` — never on TYPE=league, whose
          # commissioner-visible response carries owner emails and addresses
          # that this job would then commit.
          MFL_USER_ID: ${{ secrets.MFL_USER_ID }}
          # fetch-mfl-feeds.mjs requires a non-empty MFL_LEAGUE_ID (no
          # registry fallback — see scripts/fetch-mfl-feeds.mjs), so the ids
          # below are literals by necessity: workflow YAML can't import
          # src/config/leagues-data.mjs. Keep both in sync with LEAGUES.*.id
          # there. vars.MFL_LEAGUE_ID overrides theleague's id only — AFL has
          # no vars.* override today since it hasn't needed one.
          THELEAGUE_MFL_LEAGUE_ID: ${{ vars.MFL_LEAGUE_ID || '13522' }}
        run: |
          LEAGUES=(
            "theleague:${THELEAGUE_MFL_LEAGUE_ID}:true"
            "afl:19621:false"
          )
          for entry in "${LEAGUES[@]}"; do
            IFS=':' read -r SLUG ID HAS_SALARY_SYNC <<< "$entry"

            echo "::group::Fetch MFL data ($SLUG)"
            # --refresh-live (not --force): rosters/transactions/standings/
            # brackets refresh every run, but the heavy daily-only feeds
            # (players.json, the 17-call weeklyResults loop) fetch once a day.
            # Combined with skip-if-unchanged writes, a run where nothing
            # actually changed on MFL commits nothing.
            MFL_LEAGUE_ID="$ID" MFL_LEAGUE_SLUG="$SLUG" node ./scripts/fetch-mfl-feeds.mjs --refresh-live
            echo "::endgroup::"

            if [ "$HAS_SALARY_SYNC" = "true" ]; then
              echo "::group::Update salary averages ($SLUG)"
              # The pre-loop "Update salary averages" step passed ONLY
              # MFL_LEAGUE_ID + MFL_LEAGUE_SLUG — no host or credentials —
              # so the script's MFL export requests went out unauthenticated
              # (update-salary-averages.mjs appends USERNAME/PASSWORD/APIKEY
              # query params whenever those env vars are set). Unset the
              # step-level credential vars here to preserve that behavior
              # exactly rather than silently switching to authed requests.
              env -u MFL_HOST -u MFL_USERNAME -u MFL_PASSWORD -u MFL_API_KEY \
                MFL_LEAGUE_ID="$ID" MFL_LEAGUE_SLUG="$SLUG" node ./scripts/update-salary-averages.mjs
              echo "::endgroup::"
            fi
          done

      # Note: draft-pick contract sync runs in its own workflow
      # (sync-draft-pick-contracts.yml), May-only cron, since the rookie
      # draft is the only window that needs it.

      # Moved to run after the per-league loop (was previously sandwiched
      # between the theleague and afl fetches). fetch-live-odds.mjs pulls
      # from ESPN's scoreboard API independent of any per-league MFL data,
      # so this reordering doesn't change what it reads or writes.
      # ESPN athlete-id backfill for the players MFL omits an espn_id for.
      # Runs ONCE A DAY, not on every run: it costs 32 ESPN roster
      # fetches, and the only thing that can change the gap it fills is the
      # daily players.json refresh above. Rosters DO change on the sync
      # cadence though, so a daily pass is what keeps a newly-added player
      # from sitting without an id (and tests/espn-athlete-id-coverage.test.ts
      # red) for longer than a day. The script is non-fatal by design and
      # writes nothing when ESPN is unreachable, so a bad day leaves the
      # committed backfill in place.
      # THE WINDOW MUST BE AT LEAST THE DISPATCH INTERVAL, or the backfill
      # silently never runs. It was `MIN -lt 5`, sized for the old `*/5`
      # schedule where a run started every five minutes and an overrunning
      # 11:55 run was a second chance at the window. The primary trigger is
      # now the Vercel cron at :00/:15/:30/:45, so 12:00 is the ONLY dispatch
      # that can reach this step in time — and only if queue, install and the
      # two-league fetch all finish inside four minutes. A slow queue meant a
      # whole day with no backfill and nothing saying so.
      #
      # 15 minutes matches the dispatch interval, so the 12:00 run always
      # lands inside it and the 12:15 run (reaching this step at ~:16) never
      # does — still exactly one pass a day. The offset :07 fallback can add a
      # second pass on a day it fires, which is harmless: the script is
      # idempotent and non-fatal, and it costs 32 ESPN fetches on the rare day
      # Vercel was down.
      - name: Refresh ESPN athlete-id backfill (daily)
        run: |
          HOUR=$(date -u +%H)
          MIN=$((10#$(date -u +%M)))
          if [ "$HOUR" = "12" ] && [ "$MIN" -lt 15 ]; then
            node ./scripts/fetch-espn-athlete-ids.mjs
          else
            echo "Skipping — this step runs once daily, in the 12:00-12:14 UTC window."
          fi

      - name: Fetch live NFL odds
        run: node ./scripts/fetch-live-odds.mjs

      # Retention: prune completed seasons' daily roster snapshots down to
      # weekly keyframes + the July keeper window + season endpoints
      # (scripts/lib/retention-policy.mjs). Idempotent and near-free when
      # there's nothing to do; deletions ride the commit step below.
      - name: Consolidate roster history
        run: node ./scripts/consolidate-roster-history.mjs

      # Push alerts ride this job rather than getting crons of their own:
      # it already runs every fifteen minutes with a checkout in hand, and both
      # scripts read the feeds fetched above. Each is non-fatal by design and
      # exits 0 on any failure — they run BEFORE the commit, and a push
      # outage must not cost us the feed write that already succeeded.
      #
      # player-news diffs the injury report against a Redis snapshot it owns,
      # so it is correct even on the runs where the commit step finds nothing
      # to push. gameday no-ops on every non-game day, gated by the week's
      # NFL schedule rather than a weekday list.
      - name: Push player news (injury + status changes)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: node ./scripts/push-player-news.mjs

      - name: Push game-day alerts (swings + finals)
        env:
          TZ: America/Los_Angeles
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: node ./scripts/push-gameday-alerts.mjs

      - name: Commit and push updates
        uses: ./.github/actions/commit-push
        with:
          add-paths: 'data/ src/data/'
          commit-message: 'chore: sync rosters and playoff data'
          no-changes-message: 'No roster changes to commit.'
          git-user-name: 'Roster Sync Bot'
          pull-rebase: 'true'
