  # This workflow used to build on every push to every branch. Over Aug 28-31
  # that was 60 builds x 160 snapshots = ~9,600 snapshots, roughly 2x the
  # 5,000/month plan in four days — and 49 of those 60 were feature-branch
  # pushes. One branch alone (draft-broadcast-image-loading) spent 16 builds,
  # half a month's plan, iterating on a single PR.
  #
  # `synchronize` IS included, and the cost control is the `paths:` list below
  # rather than the trigger type. An earlier revision dropped `synchronize` to
  # make PR iteration free, which was wrong: a commit pushed after the PR opens
  # would then get its FIRST capture from the merge build on main, which runs
  # --auto-accept-changes and blesses it unreviewed. That is the "visual test
  # that certifies the bug" failure this whole file exists to avoid.
  #
  # Checked against the real burn: that 16-build draft-broadcast branch touches
  # only draft-broadcast components, styles, pages and types — NONE of which
  # are in the closure — so it triggers zero builds here. Build #117 does
  # trigger, correctly, because it edited src/config/leagues-data.mjs, which
  # renders. Narrow paths buy the savings; the trigger type buys nothing but
  # a coverage hole.
  #
  # The `visual-check` label forces a run on demand (remove and re-add to
  # re-run) for a diff the paths list does not match — on a PR into `main`
  # only. The label is read inside the `pull_request` event, and that event is
  # filtered to `branches: [main]` below, so on a feature PR into `staging` the
  # workflow never starts and the label does nothing.
  #
  # `branches: [main]` — DELIBERATELY not `[main, staging]`, unlike ci.yml and
  # codeql.yml. Every other check gates a merge into `staging` because that
  # branch is production-level; visual review is the one exception, and it is a
  # cost decision, not an oversight. Snapshots are the scarce resource here (see
  # the burn numbers above, against a 5,000/month plan), so the whole week's
  # diffs are reviewed once on the promotion PR — `staging` → `main`, which
  # matches this filter — instead of per feature PR.
  #
  # The accepted cost: a visual regression can sit on the staging hosts, which
  # real owners use, until Tuesday. `/release-review` step 6c compensates by
  # naming which commits in the range touched the story import closure, so the
  # promotion's batch of diffs can be attributed to features rather than
  # guessed at. For an earlier look at a feature branch, start the workflow by
  # hand (Actions -> Chromatic -> "Run workflow", pick the branch): that is
  # the `workflow_dispatch` trigger, and it runs on any ref. The `visual-check`
  # label CANNOT do this — a PR into `staging` never reaches this workflow.
      - 'src/components/shared/package-league/MadQualifiers.astro'
