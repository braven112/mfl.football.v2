name: Chromatic

# Visual regression for the Storybook workbench. Dev-only: this never touches
# the shipped app, and it does not gate the site build.
#
# Path-filtered on purpose. Every workflow in this repo pays a
# `pnpm install --frozen-lockfile`, so this one only runs when something it
# could actually change has changed — not on every data-sync or Schefter PR.
#
# The paths are the REAL import closure of the story suite, generated by
# `scripts/chromatic-story-deps.mjs` and pinned by
# `tests/chromatic-path-filter.test.ts`. Do not hand-edit them and do not widen
# them back to `src/utils/**`: 247 utils exist and 45 reach a story, so the
# broad glob was rebuilding the whole suite for code no snapshot renders.
#
# Narrowing a visual-test trigger is only dangerous in one direction. A file
# that renders but is NOT matched here means the regression ships, and then
# --auto-accept-changes on main blesses it as the new baseline — a visual test
# that certifies the bug. That is precisely what the guard test prevents: add
# an import, and it tells you to regenerate this list.
#
# An earlier version of this comment argued against `pull_request` because
# push+PR would double-bill. That held only while `push` was unrestricted;
# it is now scoped to main, so a change is built once on its PR and once on
# merge.
on:
  # Baselines only. Everything that lands here was already reviewed on its PR,
  # so this is the run that moves the reference forward (--auto-accept-changes
  # below). Feature-branch pushes are NOT built: see the PR trigger.
  push:
    branches: [main]
    paths:
      # Components a story renders.
      - 'src/components/TeamIconCell.astro'
      - 'src/components/ThemeImage.astro'
