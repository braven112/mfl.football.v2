  # Deliberately WITHOUT `synchronize`: iterating on a PR must be free.
  #
  # This workflow used to build on every push to every branch. Over Aug 28-31
  # that was 60 builds x 160 snapshots = ~9,600 snapshots, roughly 2x the
  # 5,000/month plan in four days — and 49 of those 60 were feature-branch
  # pushes. One branch alone (draft-broadcast-image-loading) spent 16 builds,
  # half a month's plan, iterating on a single PR.
  #
  # So: one build when a PR opens, one when a draft is marked ready, and one
  # on demand via the `visual-check` label (remove and re-add it to re-run).
