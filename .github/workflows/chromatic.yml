  workflow_dispatch:

concurrency:
  group: chromatic-${{ github.head_ref || github.ref }}
  # Superseding a feature-branch build is free — the snapshots it had already
  # captured are billed either way, and only the newest head matters.
  #
  # NEVER cancel on main. Main is the only ref running --auto-accept-changes,
  # so a cancelled build pays for its captures AND fails to accept them,
  # leaving the baseline stale while the next PR diffs against the wrong
  # reference. Two merges in quick succession would do exactly that.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  chromatic:
    name: Visual tests
    runs-on: ubuntu-latest
    # `labeled` fires for EVERY label, so gate it to the one that means "run
    # the visual tests". Drafts are skipped until marked ready — a draft PR is
    # still iterating, which is the spend this workflow exists to avoid.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'visual-check') ||
      (github.event.action != 'labeled' && github.event.pull_request.draft == false)
    # The first attempt sat in the Chromatic step for 40+ minutes with no way
    # to read its logs (GitHub only serves them once a job ends). Checkout and
    # install take ~25s combined, so anything past this is hung, not slow —
    # fail fast and surface the log instead of holding a runner for the 6-hour
    # default.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Chromatic needs full history to find the baseline commit, and
          # TurboSnap (--only-changed) needs it to diff the file set. The
          # default fetch-depth of 1 silently degrades both.
          fetch-depth: 0
          # ...but full history across this repo's several hundred branches
          # cost 4m40s of pure checkout on the first run — longer than the
          # rest of the job combined. A partial clone keeps every commit (so
          # baseline detection and the TurboSnap diff are unaffected) and
          # fetches file contents lazily only when something asks for them.
          filter: blob:none

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      - name: Run Chromatic
        id: chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "::error::CHROMATIC_PROJECT_TOKEN secret is not set."
            echo "Add it at Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # On main, whatever landed was already reviewed on its PR, so accept
          # it as the new baseline. On a PR, leave changes pending so a human
          # accepts or rejects them in the Chromatic UI.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pnpm chromatic --auto-accept-changes
          else
            pnpm chromatic
          fi

      # always(): Chromatic exits 1 whenever it finds visual changes, which is
      # the normal "a human needs to look at this" path, not an error. The cost
      # of that build still needs reporting.
      - name: Report snapshot usage
        if: always()
        run: node scripts/chromatic-usage-summary.mjs

    # NOTE: this job is advisory while the baseline settles. Visual diffs need a
    # human to accept or reject them, so leave it non-required in branch
    # protection until the snapshots are known-good, then make it required.
