name: Schefter Scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: schefter-scan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # This job ran for months WITHOUT this step, and nothing failed loudly:
      # every consumer of `@upstash/redis` here imports it dynamically and
      # degrades on error, so a missing package logged "Redis import failed"
      # and the scan exited 0. The visible symptoms were trade-bait drift
      # state never persisting and Roger's reply lane skipping every tick
      # ("No Redis — cannot read watermark or enforce rails"), neither of
      # which surfaces as a red run. Same line as every sibling scanner.
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts

      - name: Recompute league events
        env:
          TZ: America/Los_Angeles
        run: node scripts/compute-league-events.mjs

      - name: Run Schefter scanner
        env:
          TZ: America/Los_Angeles
          MFL_HOST: ${{ vars.MFL_HOST }}
          MFL_USER_ID: ${{ secrets.MFL_USER_ID }}
          # The trade-block lane's tradeBait export is owner-gated for a
          # PRIVATE league (the AFL): without a key MFL answers an EMPTY 200,
          # not an error, so the lane would run green and never post. Keys
          # are league-scoped — this must be a key for the AFL's MFL league
          # to unlock it; TheLeague's export is public and ignores it. Both
          # spellings, same as backfill-historical-feeds.yml.
          MFL_APIKEY: ${{ secrets.MFL_APIKEY }}
          MFL_API_KEY: ${{ secrets.MFL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROUPME_ROGER_BOT_ID: ${{ secrets.GROUPME_ROGER_BOT_ID }}
          GROUPME_AFL_ROGER_BOT_ID: ${{ secrets.GROUPME_AFL_ROGER_BOT_ID }}
          GROUPME_SCHEFTER_BOT_ID: ${{ secrets.GROUPME_SCHEFTER_BOT_ID }}
          GROUPME_AFL_SCHEFTER_BOT_ID: ${{ secrets.GROUPME_AFL_SCHEFTER_BOT_ID }}
          # Roger's reply lane READS the group to find shots aimed at him, which
          # the bot-post credentials above can't do — posting and reading are
          # separate GroupMe credentials. The service token is account-wide
          # (one GroupMe user, all their groups); the GROUP is per-league.
          GROUPME_SERVICE_TOKEN: ${{ secrets.GROUPME_SERVICE_TOKEN }}
          # Both group ids below are OPTIONAL overrides, not requirements. The
          # lane derives a league's group from its own Roger bot id via
          # GET /v3/bots (see scripts/lib/groupme-groups.mjs) and caches it, so
          # no new secret was needed to switch the AFL on. Set one only to
          # point a league at a group the service token doesn't own.
          GROUPME_AFL_GROUP_ID: ${{ secrets.GROUPME_AFL_GROUP_ID }}
          GROUPME_GROUP_ID: ${{ secrets.GROUPME_GROUP_ID }}
          # Optional, per league. Roger's own posts are otherwise identified by
          # sender_type==='bot' plus a /roger/i name match; these pin them by id
          # so a bot rename can't break reply detection.
          GROUPME_AFL_ROGER_BOT_SENDER_ID: ${{ secrets.GROUPME_AFL_ROGER_BOT_SENDER_ID }}
          GROUPME_ROGER_BOT_SENDER_ID: ${{ secrets.GROUPME_ROGER_BOT_SENDER_ID }}
          SCHEFTER_RUMOR_MILL_ENABLED: ${{ vars.SCHEFTER_RUMOR_MILL_ENABLED }}
          # The scanner's OWN pushes — Roger's deadline reminders, transactions,
          # the rumor mill. Every one of those is push-only or push-first now,
          # so without this the scanner delivers nothing to anybody's phone. It
          # was set on the watch-list step below but never on this one, which
          # meant `CRON_SECRET not set — skipping` on every run since the
          # fan-out was added (fixed Sep 2026).
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: node scripts/schefter-scan.mjs

      # Stamp playerIds onto posts that only name players in prose (the wire,
      # the rumor mill) so My Watch List can highlight them. Idempotent; a
      # quiet run changes nothing and the commit step below sees no diff.
      - name: Tag players in feed posts
        run: node scripts/schefter-tag-players.mjs

      # "News on your watch list" push — reads the watch-list mirrors in Redis
      # and the posts newer than its watermark. Never fails the job.
      - name: Push watch-list news
        env:
          TZ: America/Los_Angeles
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: node scripts/push-watch-list-news.mjs

      - name: Commit and push feed updates
        run: |
          # The feed files are append-only and written by several workflows on
          # overlapping crons; a plain `git pull --rebase` collides on the
          # merge=binary feed and the push fails. commit-feed-and-push reconciles
          # by content on top of the latest origin and retries (feeds union by
          # post id; resolved-events / groupme-suppressions are taken as-is). The
          # "nothing changed" guard is handled inside the script.
          git config user.name "Schefter Bot"
          git config user.email "actions@users.noreply.github.com"
          node scripts/commit-feed-and-push.mjs \
            --branch main \
            --message "chore: schefter scan — new transaction posts" \
            --files "src/data/theleague/schefter-feed.json,data/afl-fantasy/schefter-feed.json,src/data/theleague/resolved-events.json,data/afl-fantasy/resolved-events.json,data/schefter/theleague/post-history.json,data/schefter/groupme-suppressions.json"

      - name: File issue for suppressed GroupMe sends
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT=data/schefter/groupme-suppressions.json
          if [ ! -f "$REPORT" ]; then
            echo "No suppressions report — nothing to file."
            exit 0
          fi

          COUNT=$(node -e "const r=require('./'+process.argv[1]);process.stdout.write(String((r.suppressions||[]).length))" "$REPORT")
          if [ "$COUNT" = "0" ]; then
            echo "No suppressed GroupMe sends."
            exit 0
          fi

          BODY=$(node -e '
            const r = require("./" + process.argv[1]);
            const lines = [];
            lines.push(`The Schefter quality gate suppressed **${r.suppressions.length}** GroupMe send(s) this run.`);
            lines.push("");
            lines.push("These posts still landed on the website feed but were judged not worth pinging the league chat. Review and decide whether to send a corrected version manually via GroupMe.");
            lines.push("");
            for (const s of r.suppressions) {
              lines.push(`- **${s.score ?? "?"}/10** \`${s.id}\` (${s.league}) — ${s.reason ?? "no reason"}`);
              lines.push(`  > ${s.headline}`);
              if (s.body) lines.push(`  > ${s.body}`);
            }
            lines.push("");
            lines.push(`Generated ${r.generatedAt}.`);
            process.stdout.write(lines.join("\n"));
          ' "$REPORT")

          gh issue create \
            --title "Schefter quality gate: $COUNT GroupMe send(s) suppressed" \
            --label "schefter,quality-gate" \
            --body "$BODY" \
            || echo "Issue creation failed (continuing)"
