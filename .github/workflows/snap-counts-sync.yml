name: Snap Counts Sync

# Refresh NFL snap counts from NFLverse so the Free Agents page's GP / Snaps /
# Snap% columns track the season being played rather than the last one we
# happened to fetch. Nothing scheduled this before, so the columns sat on the
# 2025 season (captured in Feb 2026) through the 2026 opener.
#
# To disable this job, comment out the `cron:` line below and commit — never
# gate it on a GitHub Actions variable (CLAUDE.md "Feature flags — code, not
# GitHub Actions variables").
#
# The job runs year-round; scripts/fetch-snap-counts.mjs gates itself on
# `isSeasonWindowOpen`, so every offseason Tuesday is a no-op.

on:
  schedule:
    # 20:00 UTC Tuesday — 1 PM PDT / 12 PM PST, well after Monday Night
    # Football finalizes and NFLverse republishes the week.
    - cron: "0 20 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snap-counts-sync
  cancel-in-progress: false

jobs:
  snap-counts-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      - name: Fetch snap counts
        run: node ./scripts/fetch-snap-counts.mjs --force

      - name: Commit and push updates
        uses: ./.github/actions/commit-push
        with:
          add-paths: 'data/theleague/nfl-cache/'
          commit-message: 'chore: refresh NFL snap counts'
          no-changes-message: 'No snap count changes to commit.'
          git-user-name: 'Snap Counts Bot'
