# One-off: delete the retired rankings keys (ri:*, cr:*, dl:snapshot:*) after
# #1803 reached production. Brandon approved the delete on 2026-11-24.
# Runs once on push to this branch, then this file is removed.
name: One-off delete old rankings keys
on:
  push:
    branches: [claude/project-thread-l2xeya]
    paths: [.github/workflows/one-off-delete-old-rankings-keys.yml]
permissions:
  contents: read
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Scan and delete
        env:
          URL: ${{ secrets.KV_REST_API_URL || secrets.UPSTASH_REDIS_REST_URL }}
          TOKEN: ${{ secrets.KV_REST_API_TOKEN || secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          set -euo pipefail
          total=0
          for pat in 'ri:*' 'cr:*' 'dl:snapshot:*'; do
            cursor=0; keys=()
            while :; do
              res=$(curl -sf -H "Authorization: Bearer $TOKEN" "$URL/scan/$cursor/match/$(jq -rn --arg p "$pat" '$p|@uri')/count/1000")
              cursor=$(echo "$res" | jq -r '.result[0]')
              mapfile -t batch < <(echo "$res" | jq -r '.result[1][]')
              keys+=("${batch[@]}")
              [ "$cursor" = "0" ] && break
            done
            echo "Pattern $pat: ${#keys[@]} keys"
            printf '  %s\n' "${keys[@]}"
            for k in "${keys[@]}"; do
              [ -z "$k" ] && continue
              curl -sf -X POST -H "Authorization: Bearer $TOKEN" -d "$(jq -cn --arg k "$k" '["DEL",$k]')" "$URL" >/dev/null
              total=$((total+1))
            done
          done
          echo "Deleted $total keys"
          for pat in 'ri:*' 'cr:*' 'dl:snapshot:*'; do
            left=$(curl -sf -H "Authorization: Bearer $TOKEN" "$URL/scan/0/match/$(jq -rn --arg p "$pat" '$p|@uri')/count/10000" | jq '.result[1]|length')
            echo "Remaining $pat (first page): $left"
          done
