name: Schefter Trade Speculation

on:
  schedule:
    # Daily at 8pm UTC = 1pm Pacific. NFL-calendar-aware cadence (per
    # scripts/lib/speculation-cadence.mjs) decides whether to actually post —
    # the cron just gives the scanner a once-a-day chance.
    #
    # This same cron also runs the franchise-history recompute below, which
    # diffs new badges against the committed snapshot and auto-posts
    # milestone events to the Schefter feed (Phase 5).
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without mutating feed/ledger"
        required: false
        default: "false"

concurrency:
  group: schefter-trade-speculation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  speculate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      - name: Refresh trade-bait feed
        env:
          # fetch-trade-bait.mjs requires MFL_LEAGUE_ID (no registry
          # fallback — see scripts/fetch-trade-bait.mjs), so this is one of
          # the few places a literal id is the pragmatic choice: workflow
          # YAML can't import src/config/leagues-data.mjs. Keep this in sync
          # with LEAGUES.theleague.id there; set vars.MFL_LEAGUE_ID to
          # override without a code change.
          MFL_LEAGUE_ID: ${{ vars.MFL_LEAGUE_ID || '13522' }}
          MFL_LEAGUE_SLUG: theleague
        run: node scripts/fetch-trade-bait.mjs

      - name: Recompute franchise history (milestone diff)
        # Runs the badge engine and diffs against the committed
        # franchise-history.json snapshot. Newly-earned badges emit
        # Schefter posts directly into src/data/theleague/schefter-feed.json
        # (idempotent — dedup by deterministic post id).
        # --emit-milestone-posts is opt-in: this job COMMITS the feed, so it
        # may write posts; prebuild runs the same script without the flag.
        if: github.event.inputs.dry_run != 'true'
        run: node scripts/compute-franchise-history.mjs --emit-milestone-posts

      # The recompute above advances season-ledger.json, and owner-tenures /
      # division-strength are derived FROM that ledger — division-strength.json
      # pins its played-row count against it (tests/division-strength-data.test.ts).
      # Advancing the ledger without these would break that pin on main every
      # day, the same way committing franchise-history.json alone broke
      # tests/season-ledger.test.ts. --league=theleague because this job only
      # commits TheLeague's paths; the AFL's copies are refreshed by its own
      # backfill run, and the chain must not write files this job will discard.
      # Chained, not two steps, and in this order: division-strength reads the
      # owner tenures the first command writes (same reasoning as the
      # 'compute:owner-tenures → division-strength' entry in scripts/prebuild.mjs).
      - name: Recompute owner tenures + division strength (ledger consumers)
        if: github.event.inputs.dry_run != 'true'
        run: |
          node scripts/compute-owner-tenures.mjs --league=theleague
          node scripts/compute-division-strength.mjs --league=theleague

      - name: Run speculation scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          GROUPME_SCHEFTER_BOT_ID: ${{ secrets.GROUPME_SCHEFTER_BOT_ID }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            node scripts/schefter-trade-speculation.mjs --dry-run
          else
            node scripts/schefter-trade-speculation.mjs
          fi

      - name: Commit and push feed + ledger updates
        env:
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        if: github.event.inputs.dry_run != 'true'
        run: |
          # schefter-feed.json is append-only and written by several workflows
          # on overlapping crons; a plain `git pull --rebase` collides on it
          # (merge=binary) and the push fails. commit-feed-and-push reconciles the
          # feed by post id on top of the latest origin and retries; the derived
          # snapshots and raw mfl-feeds directory are taken as-is. "Nothing
          # changed" is guarded inside the script.
          #
          # compute-franchise-history.mjs writes BOTH franchise-history.json and
          # season-ledger.json from one parse, so BOTH must be committed here.
          # Committing only the history left the ledger frozen at whatever the
          # last human PR regenerated — 11 days stale, with every 2026 row still
          # 0-0-0 / rank null while the history beside it carried live records.
          # That is the divergence tests/season-ledger.test.ts exists to catch,
          # and it is a preview-build data bug too: preview and `pnpm dev` read
          # the committed ledger rather than recomputing it (previewSkip in
          # scripts/prebuild.mjs), so division-strength and owner-tenures were
          # built from the stale copy. tests/franchise-history-commit-paths.test.ts
          # pins the pairing; the two ledger CONSUMERS recomputed above are here
          # for the same reason — a fresher ledger beside a Sep-4 division report
          # fails tests/division-strength-data.test.ts on main.
          git config user.name "Schefter Bot"
          git config user.email "actions@users.noreply.github.com"
          node scripts/commit-feed-and-push.mjs \
            --branch main \
            --message "chore: schefter daily — speculation + milestone scan" \
            --files "src/data/theleague/schefter-feed.json,data/theleague/derived/speculation-history.json,data/theleague/derived/franchise-history.json,data/theleague/derived/season-ledger.json,data/theleague/derived/owner-tenures.json,data/theleague/derived/division-strength.json,data/theleague/mfl-feeds"
