name: Migrate TheLeague images (one-off)

# One-off: copies TheLeague's old franchise icons and banners from InMotion to
# Vercel Blob. Runs here because the Claude sandbox cannot reach InMotion.
# Delete this workflow before the PR it rides on merges.
# See scripts/inmotion-migration/migrate-theleague.mjs.

on:
  push:
    branches: [claude/project-thread-jjha9s]
    paths:
      - scripts/inmotion-migration/theleague-urls.txt
      - scripts/inmotion-migration/migrate-theleague.mjs
      - .github/workflows/migrate-theleague-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Setup pnpm + Node + install
        uses: ./.github/actions/setup

      - name: Copy images from InMotion
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node ./scripts/inmotion-migration/migrate-theleague.mjs

      - name: Commit and push the report
        uses: ./.github/actions/commit-push
        with:
          check-paths: 'scripts/inmotion-migration/theleague-report.json'
          add-paths: 'scripts/inmotion-migration/theleague-report.json'
          commit-message: 'chore: copy TheLeague images to Vercel'
          no-changes-message: 'No TheLeague images changed.'
          push-ref: ${{ github.ref_name }}
