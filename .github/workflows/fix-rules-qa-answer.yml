name: Fix Rules Q&A Answer

# Rewrites a stored "Ask Roger" answer in Redis. Roger's answers are persisted
# once and never regenerated, so correcting the constitution does not correct an
# answer already sitting on the rules-chat page — this is the repair path.
#
# Same sentinel design as the Roger Correction workflow: the push trigger is
# gated on `.github/rules-qa-fix-send`, whose contents are the fix slug. The
# path filter is what stops ordinary pushes from re-running a write. Unlike the
# GroupMe post this write IS idempotent (the script no-ops when the stored
# answer already matches), but the gate keeps the two workflows consistent and
# keeps surprise Redis writes out of routine pushes.

on:
  push:
    paths:
      - '.github/rules-qa-fix-send'
  workflow_dispatch:
    inputs:
      fix:
        description: 'Fix slug (see FIXES in scripts/fix-rules-qa-answer.mjs)'
        required: true
        type: string

concurrency:
  group: fix-rules-qa-answer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve fix slug
        id: slug
        run: |
          if [ -n "${{ inputs.fix }}" ]; then
            slug="${{ inputs.fix }}"
          elif [ -f .github/rules-qa-fix-send ]; then
            slug="$(tr -d '[:space:]' < .github/rules-qa-fix-send)"
          else
            echo "No sentinel file and no dispatch input — nothing to fix."
            echo "slug=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Resolved fix slug: $slug"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Apply the corrected answer
        if: steps.slug.outputs.slug != ''
        env:
          TZ: America/Los_Angeles
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: node scripts/fix-rules-qa-answer.mjs --fix "${{ steps.slug.outputs.slug }}" --apply
