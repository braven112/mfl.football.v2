<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- jQuery must stay: MFL's own page scripts use $ to hide the left menu, run popups and build homepage tabs. -->
<script src="https://code.jquery.com/jquery-1.12.4.js" integrity="sha256-Qw82+bXyGq6MydymqBxNPYTaUXXq7c8v3CwiYwLLNXU=" crossorigin="anonymous"></script>

<div id="archies-sprite" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden;"></div>
<script>
// ?v= busts Cloudflare's copy (s-maxage is a year); bump it when the sprite gains a symbol this header uses.
fetch('https://v2.mfl.football/assets/icons/sprite.svg?v=2')
  .then(function (r) { return r.ok ? r.text() : ''; })
  .then(function (svg) {
    document.getElementById('archies-sprite').innerHTML = svg.replace('style="display: none;"', '');
  })
  .catch(function () {});
</script>

<script src="//use.fontawesome.com/6ccd97559b.js"></script>

<script>
var lu_addOptionalStarters = false;
</script>

          </div>
          <div class="leaguename">

      </div>
